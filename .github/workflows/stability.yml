name: Stability
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:release
      - run: npm run lint
      - run: npm run build
      - run: npm pack --workspace vayu-ui-cli --workspace vayu-ui-mcp --workspace vayu-ui-registry --workspace vayu-ui --dry-run
